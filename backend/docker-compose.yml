name: myfitwellness

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myfit
      POSTGRES_PASSWORD: myfit
      POSTGRES_DB: myfitwellness
    ports:
      - "5437:5432"
    volumes:
      - myfitwellness-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfit -d myfitwellness"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://myfit:myfit@db:5432/myfitwellness
      PORT: 8080
      CORS_ORIGIN: "*"
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://myfit:myfit@db:5432/myfitwellness_test
      ADMIN_DATABASE_URL: postgres://myfit:myfit@db:5432/postgres
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node --import tsx src/scripts/create-test-db.ts && npm test"]

volumes:
  myfitwellness-pg:
